# Dependabot configuration for Rythra.
# The repository uses Bun and bun.lock for dependency management.

version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

    groups:
      all-bun-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    groups:
      all-github-actions:
        patterns:
          - "*"
