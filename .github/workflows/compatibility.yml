name: Compatibility

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  runtime:
    name: Runtime compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun install; else npm install; fi

      - name: Typecheck
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun run typecheck; else npm run typecheck; fi

      - name: Build
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun run build; else npm run build; fi

      - name: Test
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun test; else npm test; fi
